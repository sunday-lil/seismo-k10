; PlatformIO 工程配置（行空板 K10，Arduino 框架）
; 用法：把本文件放在工程根目录，main.cpp 放在 src/ 下，然后 Build / Upload
[env:unihiker]
platform = https://github.com/DFRobot/platform-unihiker.git
board = unihiker_k10
framework = arduino
monitor_speed = 115200
upload_speed = 921600

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DModel=None
